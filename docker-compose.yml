services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skiscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skiscope_dev}
      POSTGRES_DB: skiscope
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skiscope -d skiscope"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://skiscope:${POSTGRES_PASSWORD:-skiscope_dev}@db:5432/skiscope
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
